syntax = "proto3"; //指定proto使用proto3语法，不指定默认是使用proto2

// 各业务共用的结果编号；0 表示成功，非零含义由具体处理入口选择。
enum CmdCode{
	Succeed = 0;//请求成功
	AcctExist = 1;//账号已存在
	ServerError=2;//服务端错误
	AcctNotExist = 3;//账号不存在
	PasswordError= 4;//密码错误
	AcctDisable = 5;//账号禁用
	ReqParamError= 6;//请求参数错误
	NicknameExist = 7;//昵称已存在
	UserNameIllegal = 8;//用户名不合法
	PhoneNumIllegal= 9;//手机号码不合法
	PasswordIllegal=10;//密码不合法
	UserOftenLogin=11;//用户频繁登录
	VarifyError= 12;//验证码错误
	RoleNotExist = 13;//角色不存在
	FeatureNotReady = 14;//权威业务事务尚未接入
	DuplicateRequest = 15;//相同请求号对应不同请求内容
	NotEnoughCurrency = 16;//货币不足
	ShopItemNotFound = 17;//商城商品不存在
	PurchaseLimitReached = 18;//超过购买限制
	BagFull = 19;//背包空间不足
	InvalidSession = 20;//会话或角色映射无效
	InvalidQuantity = 21;//商品列表或购买数量非法
	InvalidShop = 22;//商店或 NPC 归属非法
	TransactionFailed = 23;//权威购买事务失败
	InsufficientItems = 24;//物品不足
	IncorrectBackpackType = 25;//背包类型错误
	ItemNotExist = 26;//物品不存在
	ItemNotEnough = 27;//物品不足
	SkillNotLearned = 28;//角色未学习此技能或等级为零
	SkillConfigMissing = 29;//当前等级缺失有效技能效果配置
	SkillOnCooldown = 30;//技能或公共冷却尚未结束
	SkillInsufficientMp = 31;//权威法力值不足
	SkillStateBlocked = 32;//角色当前状态不允许释放技能
	SkillTargetUnsupported = 33;//目标模式尚未接入权威场景实体链
	DungeonAlreadyEntered = 34;//角色实际身处副本，必须先退出后再发起挑战
}

message RegistVarifyRet{
	CmdCode cmd_code = 1;//错误码
	string email = 2;//邮箱
}

message ErrMsg{
	CmdCode cmd_code = 1;//错误码
}

// 业务响应的结构化错误信息，客户端以 code 判断结果，message 仅用于诊断显示。
message ErrorInfo{
	CmdCode code = 1;//机器可判断的错误码
	string message = 2;//可选诊断信息
}

// 商城购买响应。
message BuyShopItemRes{
	ErrorInfo error = 1;//购买处理结果
}

message RegistRet{
	CmdCode cmd_code = 1;//表示注册是否成功
}

message LoginRet{
	CmdCode cmd_code = 1;//表示登录是否成功
	GameServer game_server=2;//表示最后登录的服务器
	int32 account_id = 3;//用户ID
}

message GameServer{
	int32 server_id = 1;//服务器ID
	string server_name=2;//名称
	int32 run_state = 3;//运行状态
	int32 is_new = 4;//是否是新服
	string ip_host=5;//IP地址
	int32 prot = 6;//端口
}

message GetServerListRet{
	CmdCode cmd_code = 1;//表示请求是否成功
	repeated GameServer game_servers=2;//服务器列表
}

message LoginGameServerRet{
	CmdCode cmd_code = 1;//表示请求是否成功
	CreateRoleRet create_role_info = 2;//已创建的角色
}

message CreateRoleRet{
	CmdCode cmd_code = 1;//表示创建角色是否成功
	int32 role_id= 2;//角色ID
	string nickname= 3;//昵称
	int32 job_id = 4;//职业ID
	int32 level = 5;//等级
}

message StartGameRet{
	CmdCode cmd_code = 1;//表示请求是否成功
	MainRoleInfo main_role_info = 2;//主角色完整信息
	reserved 3, 4, 5;//背包容量和旧货币已统一放入 RoleKanpsackInfo
	reserved "opened_knapsack_grid_count", "kanpsack_type_count_lst";
}

// 所有角色共用的基础属性，对应 RoleBaseArrtTable。
message RoleBaseInfo{
	int32 role_id = 1;        //角色ID
	string nickname = 2;      //角色昵称
	int32 level = 3;          //角色等级
	int32 xiu_wei = 4;        //角色修为

	int32 max_hp = 5;         //最大生命值
	int32 curr_hp = 6;        //当前生命值
	int32 max_mp = 7;         //最大法力值
	int32 curr_mp = 8;        //当前法力值

	int32 job_id = 9;         //职业ID

	// 攻击属性
	int32 atk_external_min = 10; //外功攻击最小值
	int32 atk_external_max = 11; //外功攻击最大值
	int32 atk_internal_min = 12;//内功攻击最小值
	int32 atk_internal_max = 13;//内功攻击最大值

	// 防御属性
	int32 def_external = 14;    //外功防御
	int32 def_external_delta = 15;//外功防御变动值
	int32 def_internal = 16;    //内功防御
	int32 def_internal_delta = 17;//内功防御变动值

	// 常规战斗词条
	int32 hit_point = 18;        //命中属性值
	int32 block_point = 19;      //格挡属性值
	int32 zhen_ji = 20;          //振击属性值
	int32 wu_gu = 21;            //无咎属性值

	// 暴击相关
	int32 crit_point = 22;       //暴击属性值
	int32 crit_resist_point = 23;//暴抗属性值
	float crit_damage = 24;      //暴击伤害百分比，151表示151%
	float crit_damage_reduce = 25;//暴击伤害减免百分比

	// 治疗相关
	int32 heal_strength = 26;    //治疗强度
	float heal_bonus = 27;       //治疗增益百分比，1表示1%

	// PVP专属词条
	int32 zhu_xin = 28;          //诛心，PVP增伤
	int32 jian_ren = 29;         //坚韧，PVP减伤

	// 位置信息
	string pos = 30;             //地图世界坐标，使用 X_Y_Z 下划线连接的文本
	int32 map_id = 31;           //地图ID
	int32 instance_id = 32;      //副本实例ID，0 表示公共场景；同一地图内不同队伍分属不同实例
	// 高级属性：键为 GeneAttributeType 的 101 至 144，值缺省 0；只下发非零项。
	map<int32, double> advanced_attributes = 33;
}

// 队伍成员基础信息，对应 RO TeamData.memberList 的单条记录。
message TeamMemberInfo{
	uint64 role_id = 1;      //成员角色ID，服务端唯一身份
	string nickname = 2;     //成员昵称，用于队伍窗口显示
	int32 level = 3;         //成员等级
	int32 job_id = 4;        //职业ID，用于头像与职业图标
	int32 scene_id = 5;      //成员当前场景ID，对应 RO memberList.sceneId
	int32 instance_id = 6;   //成员当前副本实例ID，0 表示不在副本
	bool is_captain = 7;     //是否队长，与 TeamInfoNtf.captain_id 保持同一人
	int32 curr_hp = 8;       //当前生命值，用于队伍窗口血条
	int32 max_hp = 9;        //最大生命值，0 表示未知
}

// 队伍完整状态，服务端每次队伍变更后整包下发。
message TeamInfoNtf{
	uint64 team_id = 1;                    //队伍ID，0 表示已不在任何队伍
	uint64 captain_id = 2;                 //队长角色ID
	int32 max_member = 3;                  //队伍人数上限，对应 RO TeamData.maxTeamNumber
	repeated TeamMemberInfo members = 4;   //当前成员列表，含队长
}

// 邀请入队通知，对应 RO TeamInvatationData。
message TeamInvatationNtf{
	uint64 team_id = 1;        //发出邀请的队伍ID
	uint64 inviter_id = 2;     //邀请时是邀请人角色ID；队长收到申请时是申请人角色ID
	string inviter_name = 3;   //邀请人昵称，用于邀请弹窗
	uint64 captain_id = 4;     //该队队长角色ID
}

// 队长请求进入副本的回执，携带服务端分配的实例，成员据此加载场景。
message TeamEnterDungeonNtf{
	uint64 team_id = 1;        //发起挑战的队伍ID
	int32 dungeon_id = 2;      //副本配置ID，魔神塔为 4060
	int32 scene_id = 3;        //目标场景ID
	uint64 instance_id = 4;    //进入副本时为分配的非零实例ID；离开副本回城通知中为 0
	int32 map_id = 5;          //该实例对应的地图ID
	string pos = 6;            //出生坐标，沿用 RoleBaseInfo.pos 的 X_Y_Z 下划线格式
	repeated MonsterHpData monsters = 7;//本实例已经出生的战斗怪物及其当前血量
	DungeonFlowState flow = 9;//同实例任务、物件及波次的完整权威状态
	repeated MonsterActionData monster_actions = 8;//入场时已有 AI 的怪物当前动作，含权威位置与剩余时间
	repeated MonsterSpawnData monster_spawns = 10;//当前仍存在的技能召唤实体；固定场景波次仍由flow还原
	repeated MonsterBuffData buffs = 11;//当前所有存活Buff实例与真实剩余时长，供晚加入恢复持续表现
	int32 dungeons_degree = 12;//本实例难度配置ID；回城通知为0。
	int32 dungeon_layer = 13;//本实例规范层数；非分层及回城通知为0。
}

// 实例内的怪物属性；同一波次的多个相同模型由出生序号区分。
message MonsterHpData {
	uint64 spawn_id = 1;//高32位为波次号，低32位为从1起算的出生序号
	int32 hp = 2;//当前生命值，零表示已死亡
	int32 max_hp = 3;//本次出生的生命上限
	int32 damage = 4;//本次普攻实际扣除的生命值，入场血量快照为零
}

// GameServer 向同一副本实例可靠广播本次命中的属性变化。
message MonsterAttrUpdateNtf {
	uint64 instance_id = 1;//权威副本实例号
	repeated MonsterHpData monsters = 2;//本次血量下降的实体
	float firer_x = 3;//命中时施害者的世界坐标 X，单位米，供同实例观察者计算跳字方向
	float firer_y = 4;//命中时施害者的世界坐标 Y，单位米
	float firer_z = 5;//命中时施害者的世界坐标 Z，单位米
	repeated MonsterActionData monster_actions = 6;//本次开始或改变的怪物动作，按服务端执行顺序下发
	DungeonFlowState flow = 8;//非空时替换本实例的流程快照
	repeated MonsterPlayerHitData player_hits = 7;//怪物技能结果点实际造成的玩家血量变化
	repeated MonsterSpawnData monster_spawns = 9;//本次实际产生的动态召唤实体
	repeated uint64 removed_spawn_ids = 10;//本次离场的动态实体出生标识，与死亡表现区分
	repeated MonsterAiNoticeData ai_notices = 11;//本实例原AI触发的提示、表情或黑幕表现
	repeated MonsterBuffData buff_changes = 12;//本次原Buff实例新增、刷新或明确移除
	uint64 attacker_role_id = 13;//本次命中的持久攻击者角色 ID，非普攻第三段不填
	uint64 skill_uuid = 14;//本次命中的施法 UUID，仅普攻第三段真命中时填
}

// 角色离开视野或实例的下行通知，客户端据此删除远端角色。
message RoleLeaveNtf{
	uint64 role_id = 1;        //离开的角色ID
	int32 scene_id = 2;        //离开前所在场景ID
	uint64 instance_id = 3;    //离开前所在实例ID
}

// 主角色专有信息，由基础属性与账号、成长、服务器信息组成。
message MainRoleInfo{
	RoleBaseInfo base_info = 1;  //通用角色基础属性
	int32 account_id = 2;         //所属账号ID
	reserved 3;
	reserved "money";

	int32 exp = 4;                //当前经验值
	int32 skill_up_point = 5;     //技能升级点
	string camera_offset = 6;     //客户端镜头偏移数据
	int32 server_id = 7;          //所在游戏服务器ID
}
//返回的角色所有技能信息数据
message RoleSkillInfoRet
{
	CmdCode cmd_code = 1;//表示请求是否成功
	repeated RoleSkillInfo roleSkillInfoList = 2;
	int32 role_id = 3;//中心服查询的持久角色 ID；GameServer 转发前必须核对当前复合会话角色
}
//技能信息数据
message RoleSkillInfo
{
	int32 skill_id = 1;//技能主表配置ID
	int32 level = 2;//角色已学等级，0 表示未学习
	string bind_key = 3;//该技能保存的客户端快捷键文本
}

// 施法请求结果；失败时也返回原施法 UUID 及当前权威 MP/CD。
message SkillCastRet
{
	CmdCode cmd_code = 1;//服务器校验和提交结果
	uint64 skill_uuid = 2;//原样对应 SkillCastReq.skill_uuid
	int32 skill_id = 3;//请求的原 SkillInfo.Id
	int32 effect_id = 4;//已学等级解析出的 SkillEffectInfo.Id，无法解析时为零
	reserved 5;//原服务端另行分配的施法 ID 已废弃，保留字段号防止误用
	int64 server_time_unix_ms = 6;//回包生成时的服务器 UTC Unix 毫秒
	int32 current_mp = 7;//角色当前权威 MP
	int64 cooldown_end_unix_ms = 8;//该技能 CD 结束的服务器 UTC Unix 毫秒，无 CD 时为零
	int64 group_cooldown_end_unix_ms = 9;//公共 CD 结束的服务器 UTC Unix 毫秒，无公共 CD 时为零
	int32 cast_duration_ms = 10;//本次施法持续毫秒数，失败时为零
	int32 using_times = 11;//成功施法采用的表现列表下标，从零开始；本人据此确认预测段数
}

// 服务器确认施法后给本人和同地图附近角色的表现通知，不表示命中或伤害。
message SkillCastStartNtf
{
	int32 caster_role_id = 1;//施法者持久化角色 ID；客户端用他人角色 RoleId 索引定位实体
	uint64 skill_uuid = 2;//原样沿用客户端生成的本次施法 UUID，按施法角色区分
	int32 skill_id = 3;//原 SkillInfo.Id
	int32 effect_id = 4;//已学等级对应的技能效果 ID
	int64 start_server_time_unix_ms = 5;//服务器确认施法的 UTC Unix 毫秒
	int32 cast_duration_ms = 6;//服务器权威施法持续毫秒数
	int32 using_times = 7;//按当前职业模型和武器表现列表取模的零起始段数，供远端选择动作
}

// 服务器正常结束或中断施法的表现通知；本期没有命中广播。
message SkillCastEndNtf
{
	int32 caster_role_id = 1;//施法者持久化角色 ID，不能当客户端本地实体 UID 使用
	uint64 skill_uuid = 2;//对应开始通知的原施法 UUID
	int32 skill_id = 3;//结束的原技能 ID
	int64 end_server_time_unix_ms = 4;//服务器结束施法的 UTC Unix 毫秒
	bool interrupted = 5;//死亡、断线、切图等中断为 true，正常结束为 false
}
//返回的角色背包信息
message RoleKanpsackInfoRet
{
	CmdCode cmd_code = 1;//表示请求是否成功
	RoleKanpsackInfo role_kanpsack_info = 2;//角色背包、货币和持久化版本信息
}

// 角色背包完整信息，包含物品背包、装备栏、容量、货币和持久化版本。
message RoleKanpsackInfo
{
	repeated Kanpsacktypecount kanpsack_type_count_lst = 1;//各背包已开启格子容量
	repeated RoleItemInfo role_pack_plain = 2;//角色普通背包，不包含装备、消耗品和材料
	repeated RoleItemInfo role_pack_equip = 3;//角色装备背包
	repeated RoleItemInfo role_pack_consume = 4;//角色消耗品背包
	repeated RoleItemInfo role_pack_material = 5;//角色材料背包
	repeated RoleItemInfo role_currt_equip_pack = 6;//角色当前已装备栏
	int64 save_version = 7;//CenterServer 已持久化的物品版本
  repeated RoleItemInfo role_virtual_item_pack = 8;//角色虚拟物品，不占用普通背包格子
  repeated RoleCountInfo role_count_info_list = 9;//角色商城、副本次数
}

// 角色商城和副本次数的通用登录与持久化快照。
message RoleCountInfo
{
  int32 action = 1;//次数行为，对应 RoleCountAction
  int32 count_key = 2;//商品 GoodsId 或副本配置 ID
  int64 count = 3;//已使用次数
  int64 last_refresh_time = 4;//上次刷新时间的 UTC ticks
}

// 角色登录进入世界时返回的商城购买次数记录。
message RoleShopPurchaseInfoRet
{
	CmdCode cmd_code = 1;//查询结果
	repeated RoleShopPurchaseInfo purchase_info_list = 2;//角色已保存的商城购买记录
}

// 一条角色商城商品购买次数记录，对应 RoleShopPurchaseTable。
message RoleShopPurchaseInfo
{
	reserved 2;
	reserved "npc_id";
	int32 role_id = 1;//角色 ID
	int32 goods_id = 3;//商品配置 ID，对应 ShopItemInfo.GoodsId
	string daily_purchase_date = 4;//每日限购计数所属日期，使用 ISO-8601 文本
	int32 daily_purchase_count = 5;//当日已购买次数
	int32 total_purchase_count = 6;//永久累计购买次数
	string create_date = 7;//记录创建时间，使用 ISO-8601 文本
	string update_date = 8;//记录最后更新时间，使用 ISO-8601 文本
}

// 一类背包已开启的容量，以格子为单位。
message Kanpsacktypecount
{
	int32 type =1;//包类型
	int32 count =2;//该包裹已开启的格子数量
}
// 一个物品堆叠的实例数据，物品UID与配置ID分别用于实例关联和查询配置。
message RoleItemInfo
{
	int64 item_uid = 1;//物品实例 UID，全链路禁止截断为 32 位
	int32 count = 2;//物品数量
	int32 role_id = 3;//角色id
	int32 item_type_id = 4;//物品配置id
	int32 bag_type = 5;//背包类型
	int32 bag_index = 6;//所在背包位置
	RoleEquipItemInfo equip_info = 7;//装备信息，非装备物品为空
	RoleEquipGeneInfo equip_gene_info = 8;//装备词条信息，非装备物品为空
	int32 item_sign = 9;//物品状态位
	int32 money_type = 10;//买入价格使用的货币类型
	int64 total_price = 11;//当前堆叠的总买入价格
	int64 create_time_utc_ticks = 12;//物品创建时间的 UTC ticks
	int64 expire_time_utc_ticks = 13;//物品过期时间的 UTC ticks，0 表示永久
}

// 与物品实例UID关联的装备专用字段。
message RoleEquipItemInfo
{
	int64 item_uid = 1;//物品实例 UID
	int32 role_id = 2;//角色id
	int32 strengthen_level = 3;//装备强化等级，非装备时为0
	int32 equip_type = 4;//装备类别
	int32 special_skill_id0 = 5;//装备实例的第一个特技配置族编号，0为空
	int32 special_skill_id1 = 6;//装备实例的第二个特技配置族编号，0为空
	int32 special_skill_id2 = 7;//装备实例的第三个特技配置族编号，0为空
	int32 active_special_skill_index = 8;//唯一启用的特技槽位下标，范围0到2
	int32 opened_special_skill_count = 9;//已开启的特技孔数量，取值0到3，按0/1/2顺序开孔
}

// 同一装备的三个词条槽位：每槽保存配置ID与实际数值。
message RoleEquipGeneInfo
{
	int64 item_uid = 1;//物品实例 UID
	int32 role_id = 2;//角色id
	int32 gene_id0 = 3;//装备词条0
	int32 gene_id1 = 4;//装备词条1
	int32 gene_id2 = 5;//装备词条2
	int32 gene_value0 = 6;//装备词条0数值
	int32 gene_value1 = 7;//装备词条1数值
	int32 gene_value2 = 8;//装备词条2数值
}

// CenterServer 在数据库事务提交后返回的角色物品保存确认。
message SaveRoleDataRet
{
	CmdCode cmd_code = 1;//保存结果
	int32 role_id = 2;//角色 ID
	int64 version = 3;//已确认或拒绝的请求版本
	string message = 4;//失败诊断信息，成功时为空
	int64 persisted_version = 5;//中心服当前已持久化版本，拒绝旧版本时用于对齐状态
}

// 背包开格子结果。无论成功或失败，都会返回服务器当前已开启的数量。
message OpenKnapsackGridRet
{
	CmdCode cmd_code = 1;//处理结果
	int32 role_id = 2;//角色ID
	int32 current_opened_grid_count = 3;//服务器当前已开启的背包格子数量
	int32 knapsack_type = 4;//背包类型，对应 KnapsackType
}
// 一条业务次数当前值；type 和 id 共同确定是哪项商城或副本次数。
message CountItemInfo{
	int64 type = 1;//次数业务分类，对应 RoleCountAction
	int64 id = 2;//商品GoodsId或其他业务对象ID
	int32 count = 3;//当前计数值，不是背包物品数量
	int64 cd_time_stamp = 4;//预留时间字段，当前次数通知没有赋值
}
//通知客户端数量变化
message GetCountInfoRes{
	CmdCode cmd_code = 1;
	repeated CountItemInfo item_list = 2;
}
message CountUpdateSyncInfo{
	CmdCode cmd_code = 1;
	repeated CountItemInfo item_list = 2;
}
message MapKey64Value32
{
		uint64 key = 1;//删除通知中的物品实例UID
		int32 val = 2;//本次物品变化原因编号
}
message UpdateItem
{
	repeated MapKey64Value32 delete_list = 1;//需要客户端移除的物品实例及其原因
	int64 update_time = 2;//增量通知生成时间，UTC Unix秒
	repeated RoleItemInfo item_list = 3;//需要客户端新增或更新的物品当前状态
}

// 背包增量回包，包含结果码以及增删改列表。
message UpdateItemRet
{
	CmdCode cmd_code = 1;
	UpdateItem ItemDate = 2;
}

// 服务器向现有附近角色转发的 RO 移动状态，本人按本地移动继续执行。
message SyncMoveNtf
{
  int32 role_id = 1;//移动者持久角色 ID，用于客户端现有角色索引
  float dx = 2;//本段结束世界坐标 X，单位米
  float dy = 3;//本段结束世界坐标 Y，单位米
  float dz = 4;//本段结束世界坐标 Z，单位米
  float face = 5;//绕世界 Y 轴的朝向，单位度，0 到 360
  float time = 6;//本段移动耗时，单位秒，供远端插值
  bool is_moving = 7;//本段末帧是否仍处于主动移动状态
  bool is_moved = 8;//本段是否产生位置变化，供远端动画接入
  int32 jump_count = 9;//移动者当前跳跃段，0表示落地或未跳跃，1到3表示对应跳跃段
}

// 怪物在服务端决定的表现阶段，巡逻和追击共用沿导航段移动的表现。
enum MonsterActionPhase {
	MonsterActionPhaseIdle = 0;   // 当前站定或在巡逻点等待
	MonsterActionPhaseMove = 1;   // 正沿当前导航段前往目标点
	MonsterActionPhaseAttack = 2; // 正在播放本次普攻，伤害另由服务端结果点下发
	MonsterActionPhaseDead = 3;   // 生命已归零，停止移动和攻击
	MonsterActionPhaseSinging = 4; // 当前为吟唱，结束后攻击时间轴从零开始
}

// 同一出生位的一段动作。入场快照从怪物此刻的位置开始，使用该段剩余时间。
message MonsterActionData {
	uint64 spawn_id = 1;       // 本实例的稳定出生标识，高 32 位为波次，低 32 位为序号
	MonsterActionPhase phase = 2; // 当前动作阶段
	float x = 3;               // 通知生成时的权威世界坐标 X，单位米
	float y = 4;               // 通知生成时的权威世界坐标 Y，单位米
	float z = 5;               // 通知生成时的权威世界坐标 Z，单位米
	float to_x = 6;            // 当前移动段终点 X，单位米
	float to_y = 7;            // 当前移动段终点 Y，单位米
	float to_z = 8;            // 当前移动段终点 Z，单位米
	int32 duration_ms = 9;     // 移动段或本次攻击剩余时长，单位毫秒
	float face = 10;           // 绕世界 Y 轴的朝向，单位度，零度朝世界正 Z
	int32 skill_id = 11;       // 攻击阶段使用的怪物技能配置号
	int32 target_role_id = 12; // 当前追击或攻击的玩家角色 ID，无目标为零
	int32 elapsed_ms = 13;     // 当前攻击已经过的毫秒数，恢复进行中的挥刀时使用
	float cast_x = 14;         // 本次技能锁定的地面或目标点X，单位米
	float cast_y = 15;         // 本次技能锁定的地面或目标点Y，单位米
	float cast_z = 16;         // 本次技能锁定的地面或目标点Z，单位米
	int32 skill_level = 17;    // 原实体技能槽指定的等级，从1开始
}

// 不属于固定场景波次的实际召唤实体，模型和缩放按原Entity/Present配置解析。
message MonsterSpawnData {
	uint64 spawn_id = 1; // 副本实例内唯一出生标识，不与固定波次冲突，离场后不复用
	int32 entity_id = 2; // 原EntityTable编号，包含不可见机制实体
	float x = 3;        // 服务器实际出生世界坐标X，单位米
	float y = 4;        // 服务器实际出生世界坐标Y，单位米
	float z = 5;        // 服务器实际出生世界坐标Z，单位米
	float face = 6;     // 出生绕世界Y轴角度，零为正Z
}

// 原AI表现通知，目标角色为零时向同实例可见成员展示。
message MonsterAiNoticeData {
	int32 kind = 1;           // 1为TVNotice、2为HeadShow表情、3为BlackCurtain
	int32 notice_id = 2;      // 对应原表配置编号
	uint64 source_spawn_id = 3; // 触发此表现的服务端出生标识
	int32 target_role_id = 4; // 非零时仅指定角色消费此表现
}

// 由 GameServer 结算的单次怪物攻击结果，用角色 ID 定位玩家、出生标识定位施害者。
message MonsterPlayerHitData {
	int32 target_role_id = 1; // 受击玩家角色 ID
	int32 hp = 2;             // 本次扣血后的权威生命，零为死亡
	int32 max_hp = 3;         // 受击玩家的生命上限
	int32 damage = 4;         // 本次实际扣除的生命点
	uint64 spawn_id = 5;      // 发起这次攻击的怪物出生标识
	int32 skill_id = 6;       // 造成此次结果的原技能编号，用于选受击特效
	int32 result_index = 7;   // 原MSkillData.ResultList的零基序号
	bool critical = 8;        // 服务端本次结果是否暴击，决定原暴击表现
}

// 玩家仅提交场景交互对象，位置和解锁由游戏服验证。
message DungeonInteractReq {
 int32 object_id = 1;//原场景物件编号，0有效
 int32 wave_id = 2;//大于零表示采集波次，否则点击物件
}
// 同实例位置变化或单播失败校正。
message DungeonInteractRet {
 bool success = 1;//交互是否实际执行
 string reason = 2;//失败展示原因
 uint64 instance_id = 3;//位置所属实例
 int32 role_id = 4;//角色持久编号
 string pos = 5;//服务端当前X_Y_Z米制坐标
 bool exited = 6;//随后是否由既有入场协议回城
}
// 任务进度取自同一份场景XML的目标定义。
message DungeonObjectiveData {
 int32 id = 1;//目标配置编号
 string description = 2;//目标展示文本
 int32 current = 3;//已完成前置波次数或事件数
 int32 total = 4;//需要完成的波次数或事件数
 bool completed = 5;//是否已达成目标
}
// 入场、中途加入和事件变更共用完整快照，集合均为替换语义。
message DungeonFlowState {
 repeated int32 active_wave_ids = 1;//已经激活的波次
 repeated int32 completed_wave_ids = 2;//已经完成的波次
 repeated int32 active_object_ids = 3;//当前存在的场景物件
 repeated int32 active_wall_ids = 4;//当前具有权威碰撞的空气墙物件
 repeated DungeonObjectiveData objectives = 5;//已激活的任务目标与实际进度
 bool finished = 6;//已触发配置的完成事件
}

// 客户端可请求的装备实例操作，服务端按会话确定角色。
enum EquipOperation {
	None = 0;//未指定操作
	Wear = 1;//穿戴装备或替换同部位装备
	TakeOff = 2;//卸下当前穿戴的装备
	SwitchSpecialSkill = 3;//切换装备实例唯一启用的特技槽位
	OpenSpecialSkillSlot = 4;//消耗铜币开启装备的下一个特技孔
}

// 装备操作结果；成功后的完整物品位置和装备字段沿用 UpdateItemRet 下发。
message EquipOperationRet {
	CmdCode cmd_code = 1;//权威操作结果
	int64 item_uid = 2;//本次请求操作的装备实例UID
	EquipOperation operation = 3;//本次执行的装备操作
}

// 装备和基因效果计算后的最终角色属性，裸属性仍由角色存档保存。
message RoleAttributeUpdateNtf {
	RoleBaseInfo base_info = 1;//本次计算得到的最终战斗属性及当前生命法力
    bool genes_full = 2;//true先清空再装载完整列表；false且genes为空表示基因没有变化
    repeated RoleGeneData genes = 3;//本角色根节点的完整列表或真实增删/刷新项
    int32 gene_scenario = 4;//当前基因场景类别，0公共、1副本、2PvP
}

// 运行节点的展示同步边界；客户端仍由具体类型工厂创建GeneBase，不保存协议对象为运行状态。
message RoleGeneData {
    int32 gene_id = 1;//实际节点编号，允许服务端动态配置使用负值
    uint64 source_id = 2;//根来源实体或装备UID
    int32 source_slot = 3;//同来源独立槽，与gene_id/source_id共同标识根
    uint64 firer_id = 4;//实际施加角色编号
    int32 stack_count = 5;//服务器当前根层数
    int64 remaining_ms = 6;//显示剩余毫秒，-1为永久；客户端到零仍等待权威移除
    bool removed = 7;//true只按根身份移除，其余展示参数不使用
    string name = 8;//实际基因名称，动态节点同样由服务器提供
    int32 effect_type = 9;//具体节点效果类型，使用GeneEffectType数值
    int32 attribute_id = 10;//具体属性节点类型；非属性为0
    int32 state = 11;//状态节点的状态位
    int32 remaining_triggers = 12;//次数节点当前剩余次数
    int32 trigger_event = 13;//事件/次数节点对应的事件
    repeated RoleGeneData children = 14;//实际关联树，仅传展示所需类型/次数；子节点共享根来源和寿命
    int32 scenario = 15;//节点自己的场景限制，保留祖先约束
}

// 原Buff的表现身份与寿命，客户端不据此执行伤害、数值或免疫判定。
message MonsterBuffData {
    uint64 target_spawn_id = 1;//怪物/NPC目标出生位，玩家目标时为零
    int32 target_role_id = 2;//玩家持久角色ID，怪物目标时为零
    uint64 caster_spawn_id = 3;//原施加者出生位，用于原LinkFx连接
    int32 buff_id = 4;//原BuffTable完整Id，包含原等级
    int32 remaining_ms = 5;//当前剩余毫秒，-1表示原常驻Buff
    bool removed = 6;//true仅移除此buff_instance_id，不能移除其它来源同Buff
    uint64 buff_instance_id = 7;//当前副本实例内单调唯一编号，不复用
}

// 原NetAIEventCommand仅发送命令事件名，角色与动态场景由服务器当前会话解析。
message DungeonCommandEventReq {
    string name = 1;//原剧情命令中的事件名，例如NPC20186帮助选项的BossEnterCombat
}

// 复活只作用于请求连接绑定的角色；客户端不提交角色编号或位置。
message RoleReviveReq {
}
// 成功结果向同场景角色广播；失败只回复请求者。
message RoleReviveRet {
 bool success = 1;//服务端是否完成复活
 string reason = 2;//拒绝复活的可读原因
 RoleBaseInfo base_info = 3;//包含最终装备属性、恢复后的资源和权威出生坐标
}
