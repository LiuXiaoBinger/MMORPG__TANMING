syntax = "proto3"; //指定proto使用proto3语法，不指定默认是使用proto2

enum CmdCode{
	Succeed = 0;//请求成功
	AcctExist = 1;//账号已存在
	ServerError=2;//服务端错误
	AcctNotExist = 3;//账号不存在
	PasswordError= 4;//密码错误
	AcctDisable = 5;//账号禁用
	ReqParamError= 6;//请求参数错误
	NicknameExist = 7;//昵称已存在
	UserNameIllegal = 8;//用户名不合法
	PhoneNumIllegal= 9;//手机号码不合法
	PasswordIllegal=10;//密码不合法
	UserOftenLogin=11;//用户频繁登录
	VarifyError= 12;//验证码错误
	RoleNotExist = 13;//角色不存在
	FeatureNotReady = 14;//权威业务事务尚未接入
	DuplicateRequest = 15;//相同请求号对应不同请求内容
	NotEnoughCurrency = 16;//货币不足
	ShopItemNotFound = 17;//商城商品不存在
	PurchaseLimitReached = 18;//超过购买限制
	BagFull = 19;//背包空间不足
	InvalidSession = 20;//会话或角色映射无效
	InvalidQuantity = 21;//商品列表或购买数量非法
	InvalidShop = 22;//商店或 NPC 归属非法
	TransactionFailed = 23;//权威购买事务失败
	InsufficientItems = 24;//物品不足
	IncorrectBackpackType = 25;//背包类型错误
	ItemNotExist = 26;//物品不存在
	ItemNotEnough = 27;//物品不足
}

message RegistVarifyRet{
	CmdCode cmd_code = 1;//错误码
	string email = 2;//邮箱
}

message ErrMsg{
	CmdCode cmd_code = 1;//错误码
}

// 业务响应的结构化错误信息，客户端以 code 判断结果，message 仅用于诊断显示。
message ErrorInfo{
	CmdCode code = 1;//机器可判断的错误码
	string message = 2;//可选诊断信息
}

// 商城购买响应。
message BuyShopItemRes{
	ErrorInfo error = 1;//购买处理结果
}

message RegistRet{
	CmdCode cmd_code = 1;//表示注册是否成功
}

message LoginRet{
	CmdCode cmd_code = 1;//表示登录是否成功
	GameServer game_server=2;//表示最后登录的服务器
	int32 account_id = 3;//用户ID
}

message GameServer{
	int32 server_id = 1;//服务器ID
	string server_name=2;//名称
	int32 run_state = 3;//运行状态
	int32 is_new = 4;//是否是新服
	string ip_host=5;//IP地址
	int32 prot = 6;//端口
}

message GetServerListRet{
	CmdCode cmd_code = 1;//表示请求是否成功
	repeated GameServer game_servers=2;//服务器列表
}

message LoginGameServerRet{
	CmdCode cmd_code = 1;//表示请求是否成功
	CreateRoleRet create_role_info = 2;//已创建的角色
}

message CreateRoleRet{
	CmdCode cmd_code = 1;//表示创建角色是否成功
	int32 role_id= 2;//角色ID
	string nickname= 3;//昵称
	int32 job_id = 4;//职业ID
	int32 level = 5;//等级
}

message StartGameRet{
	CmdCode cmd_code = 1;//表示请求是否成功
	MainRoleInfo main_role_info = 2;//主角色完整信息
	reserved 3, 4, 5;//背包容量和旧货币已统一放入 RoleKanpsackInfo
	reserved "opened_knapsack_grid_count", "kanpsack_type_count_lst";
}

// 所有角色共用的基础属性，对应 RoleBaseArrtTable。
message RoleBaseInfo{
	int32 role_id = 1;        //角色ID
	string nickname = 2;      //角色昵称
	int32 level = 3;          //角色等级
	int32 xiu_wei = 4;        //角色修为

	int32 max_hp = 5;         //最大生命值
	int32 curr_hp = 6;        //当前生命值
	int32 max_mp = 7;         //最大法力值
	int32 curr_mp = 8;        //当前法力值

	int32 job_id = 9;         //职业ID

	// 攻击属性
	int32 atk_external_min = 10; //外功攻击最小值
	int32 atk_external_max = 11; //外功攻击最大值
	int32 atk_internal_min = 12;//内功攻击最小值
	int32 atk_internal_max = 13;//内功攻击最大值

	// 防御属性
	int32 def_external = 14;    //外功防御
	int32 def_external_delta = 15;//外功防御变动值
	int32 def_internal = 16;    //内功防御
	int32 def_internal_delta = 17;//内功防御变动值

	// 常规战斗词条
	int32 hit_point = 18;        //命中属性值
	int32 block_point = 19;      //格挡属性值
	int32 zhen_ji = 20;          //振击属性值
	int32 wu_gu = 21;            //无咎属性值

	// 暴击相关
	int32 crit_point = 22;       //暴击属性值
	int32 crit_resist_point = 23;//暴抗属性值
	float crit_damage = 24;      //暴击伤害百分比，151表示151%
	float crit_damage_reduce = 25;//暴击伤害减免百分比

	// 治疗相关
	int32 heal_strength = 26;    //治疗强度
	float heal_bonus = 27;       //治疗增益百分比，1表示1%

	// PVP专属词条
	int32 zhu_xin = 28;          //诛心，PVP增伤
	int32 jian_ren = 29;         //坚韧，PVP减伤

	// 位置信息
	string pos = 30;             //地图位置
	int32 map_id = 31;           //地图ID
}

// 主角色专有信息，由基础属性与账号、成长、服务器信息组成。
message MainRoleInfo{
	RoleBaseInfo base_info = 1;  //通用角色基础属性
	int32 account_id = 2;         //所属账号ID
	reserved 3;
	reserved "money";

	int32 exp = 4;                //当前经验值
	int32 skill_up_point = 5;     //技能升级点
	string camera_offset = 6;     //客户端镜头偏移数据
	int32 server_id = 7;          //所在游戏服务器ID
}
//返回的角色所有技能信息数据
message RoleSkillInfoRet
{
	CmdCode cmd_code = 1;//表示请求是否成功
	repeated RoleSkillInfo roleSkillInfoList = 2;
}
//技能信息数据
message RoleSkillInfo
{
	int32 skill_id = 1;
	int32 level = 2;
	string bind_key = 3;
}
//返回的角色背包信息
message RoleKanpsackInfoRet
{
	CmdCode cmd_code = 1;//表示请求是否成功
	RoleKanpsackInfo role_kanpsack_info = 2;//角色背包、货币和持久化版本信息
}

// 角色背包完整信息，包含物品背包、装备栏、容量、货币和持久化版本。
message RoleKanpsackInfo
{
	repeated Kanpsacktypecount kanpsack_type_count_lst = 1;//各背包已开启格子容量
	repeated RoleItemInfo role_pack_plain = 2;//角色普通背包，不包含装备、消耗品和材料
	repeated RoleItemInfo role_pack_equip = 3;//角色装备背包
	repeated RoleItemInfo role_pack_consume = 4;//角色消耗品背包
	repeated RoleItemInfo role_pack_material = 5;//角色材料背包
	repeated RoleItemInfo role_currt_equip_pack = 6;//角色当前已装备栏
	int64 save_version = 7;//CenterServer 已持久化的物品版本
  repeated RoleItemInfo role_virtual_item_pack = 8;//角色虚拟物品，不占用普通背包格子
  repeated RoleCountInfo role_count_info_list = 9;//角色商城、副本次数
}

// 角色商城和副本次数的通用登录与持久化快照。
message RoleCountInfo
{
  int32 action = 1;//次数行为，对应 RoleCountAction
  int32 count_key = 2;//商品 GoodsId 或副本配置 ID
  int64 count = 3;//已使用次数
  int64 last_refresh_time = 4;//上次刷新时间的 UTC ticks
}

// 角色登录进入世界时返回的商城购买次数记录。
message RoleShopPurchaseInfoRet
{
	CmdCode cmd_code = 1;//查询结果
	repeated RoleShopPurchaseInfo purchase_info_list = 2;//角色已保存的商城购买记录
}

// 一条角色商城商品购买次数记录，对应 RoleShopPurchaseTable。
message RoleShopPurchaseInfo
{
	reserved 2;
	reserved "npc_id";
	int32 role_id = 1;//角色 ID
	int32 goods_id = 3;//商品配置 ID，对应 ShopItemInfo.GoodsId
	string daily_purchase_date = 4;//每日限购计数所属日期，使用 ISO-8601 文本
	int32 daily_purchase_count = 5;//当日已购买次数
	int32 total_purchase_count = 6;//永久累计购买次数
	string create_date = 7;//记录创建时间，使用 ISO-8601 文本
	string update_date = 8;//记录最后更新时间，使用 ISO-8601 文本
}

message Kanpsacktypecount
{
	int32 type =1;//包类型
	int32 count =2;//该包裹已开启的格子数量
}
message RoleItemInfo
{
	int64 item_uid = 1;//物品实例 UID，全链路禁止截断为 32 位
	int32 count = 2;//物品数量
	int32 role_id = 3;//角色id
	int32 item_type_id = 4;//物品配置id
	int32 bag_type = 5;//背包类型
	int32 bag_index = 6;//所在背包位置
	RoleEquipItemInfo equip_info = 7;//装备信息，非装备物品为空
	RoleEquipGeneInfo equip_gene_info = 8;//装备词条信息，非装备物品为空
	int32 item_sign = 9;//物品状态位
	int32 money_type = 10;//买入价格使用的货币类型
	int64 total_price = 11;//当前堆叠的总买入价格
	int64 create_time_utc_ticks = 12;//物品创建时间的 UTC ticks
	int64 expire_time_utc_ticks = 13;//物品过期时间的 UTC ticks，0 表示永久
}

message RoleEquipItemInfo
{
	int64 item_uid = 1;//物品实例 UID
	int32 role_id = 2;//角色id
	int32 strengthen_level = 3;//装备强化等级，非装备时为0
	int32 equip_type = 4;//装备类别
}

message RoleEquipGeneInfo
{
	int64 item_uid = 1;//物品实例 UID
	int32 role_id = 2;//角色id
	int32 gene_id0 = 3;//装备词条0
	int32 gene_id1 = 4;//装备词条1
	int32 gene_id2 = 5;//装备词条2
	int32 gene_value0 = 6;//装备词条0数值
	int32 gene_value1 = 7;//装备词条1数值
	int32 gene_value2 = 8;//装备词条2数值
}

// CenterServer 在数据库事务提交后返回的角色物品保存确认。
message SaveRoleDataRet
{
	CmdCode cmd_code = 1;//保存结果
	int32 role_id = 2;//角色 ID
	int64 version = 3;//已确认或拒绝的请求版本
	string message = 4;//失败诊断信息，成功时为空
	int64 persisted_version = 5;//中心服当前已持久化版本，拒绝旧版本时用于对齐状态
}

// 背包开格子结果。无论成功或失败，都会返回服务器当前已开启的数量。
message OpenKnapsackGridRet
{
	CmdCode cmd_code = 1;//处理结果
	int32 role_id = 2;//角色ID
	int32 current_opened_grid_count = 3;//服务器当前已开启的背包格子数量
	int32 knapsack_type = 4;//背包类型，对应 KnapsackType
}
// 一般表示什么物品数量变化
message CountItemInfo{
	int64 type = 1;
	int64 id = 2;
	int32 count = 3;
	int64 cd_time_stamp = 4;
}
//通知客户端数量变化
message GetCountInfoRes{
	CmdCode cmd_code = 1;
	repeated CountItemInfo item_list = 2;
}
message CountUpdateSyncInfo{
	CmdCode cmd_code = 1;
	repeated CountItemInfo item_list = 2;
}
message MapKey64Value32
{
		uint64 key = 1;
		int32 val = 2;
}
message UpdateItem
{
	repeated MapKey64Value32 delete_list = 1;//需要删除的itme
	int64 update_time = 2;
	repeated RoleItemInfo item_list = 3;
}

message UpdateItemRet
{
	CmdCode cmd_code = 1;
	UpdateItem ItemDate = 2;
}
