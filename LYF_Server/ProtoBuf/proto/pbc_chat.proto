syntax = "proto3";
import "ResultEntity.proto";

// 保留 RO 的既有频道编号；本版本开放队伍、当前场景和世界。
enum ChatMsgType {
  CHAT_TYPE_PRIVATE = 0; // 保留 RO 默认枚举值，不作为本版本的发送频道。
  CHAT_TYPE_TEAM = 2; // MS 权威队伍中的在线成员。
  CHAT_TYPE_CURSCENE = 4; // 发送者所处地图和副本实例。
  CHAT_TYPE_WORLD = 5; // 当前游戏分区内的在线角色。
}

// 消息媒介类型，编号与 RO 一致。
enum ChatMediumType {
  ChatMediumTypeNone = 0; // 未指定媒介。
  ChatMediumTypeText = 1; // 普通文字。
  ChatMediumTypeAudio = 2; // 已上传的语音留言。
}

// RO 语音消息引用，音频本体另行按 ID 下载。
message AudioChat {
  string audio_id = 1; // 服务端收到完整录音后签发的文件 ID。
  string text = 2; // 预留转写结果，本版默认空字符串。
  float duration = 3; // 录音文件的时长，单位秒。
}

// 频道、权威时间和真实发言人，使用 RO 字段编号。
message ChatMsgHead {
  ChatMsgType msg_type = 1; // 玩家选择的频道。
  uint64 msg_time = 3; // MS 接受消息的 Unix 秒时间戳。
  uint64 sender_uid = 4; // GS 通过网关登录会话确认的角色号。
}

// 聊天窗口展示的数据，语音和文字共享频道分发。
message ChatMsg {
  ChatMsgHead msg_head = 1; // 此条发言的频道、时间和作者。
  string msg_content = 2; // 文本消息正文。
  ChatMediumType medium = 3; // 正文是文字还是语音。
  AudioChat audio = 4; // 语音文件引用及转写。
  string sender_name = 9; // 本项目随通知发送真实角色昵称，供窗口渲染。
}

// 客户端提交聊天使用的 RPC 请求体。
message SendChatMsgArg { ChatMsg msg = 1; }
// 仅回给发言人的结果，聊天行通过单独的通知下发。
message SendChatMsgRes {
  CmdCode result = 1; // 本项目已有的统一业务结果。
  int64 residue_chat_cd = 2; // 该频道距离下次发言的剩余秒数。
  string reason = 3; // 拒绝发言时向玩家显示的原因。
}
// MS 下发的消息和指定收件人清单。
message ChatMsgWithLists {
  ChatMsg chat_msg = 1; // 已由 MS 受理的聊天内容。
  repeated uint64 receiver_list = 2; // 队伍频道的角色号，其他频道按分区或场景选人。
}

// 语音媒体使用单声道、16 kHz、有符号 16 位小端 PCM。
message UploadChatAudioArg {
  int32 offset = 1; // 本片在完整录音中的字节偏移。
  bytes chunk = 2; // 受帧长限制的一片语音数据。
  bool complete = 3; // 是否为尾片。
}
message UploadChatAudioRes {
  CmdCode result = 1; // 服务端是否接受此片。
  int32 next_offset = 2; // 已连续接收的字节数。
  AudioChat audio = 3; // 收齐后才含文件 ID 和服务端计算的时长。
}
message DownloadChatAudioArg {
  string audio_id = 1; // 玩家实际收到的文件 ID。
  int32 offset = 2; // 从此字节开始下载。
}
message DownloadChatAudioRes {
  CmdCode result = 1; // 录音存在且偏移有效时成功。
  string audio_id = 2; // 对应当前播放选择。
  int32 offset = 3; // 本片起始字节。
  bytes chunk = 4; // 文件内容片段。
  int32 total_bytes = 5; // 完整录音长度，用于判断下载完成。
}
