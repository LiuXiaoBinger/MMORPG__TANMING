syntax = "proto3";
import "ResultEntity.proto";

// 地图分线的运行时目录项；实例号可区分同一 GS 上的多份公共场景。
message PublicSceneLine {
  int32 map_id = 1; // 公共地图配置编号。
  int32 line_id = 2; // 同地图内从一开始的展示编号。
  int32 game_id = 3; // 实际承载场景的 GS 实例编号。
  int64 scene_uid = 4; // 区服内的运行时场景编号。
  int32 population = 5; // 已由 GS 确认进入该线的角色数。
  int32 capacity = 6; // 手动选线及优先进入原宿主时的容量阈值。
}

// 客户端只提供目标线路；地图和角色由受信会话取得。
message SceneLineRequest { int32 line_id = 1; }

// 查询、切换与初次入场共用的客户端可读结果。
message SceneLineResult {
  string reason = 1; // 失败原因，成功时为空。
  int32 current_line = 2; // 玩家当前线路号。
  repeated PublicSceneLine lines = 3; // 当前地图可用的线路。
}

// 跨 GS 交接的临时角色数据；背包、技能和次数沿用中心服已确认的角色版本。
message SceneRoleTransfer {
  MainRoleInfo role = 1; // 原 GS 的角色与位置、即时资源。
  PublicSceneLine scene = 2; // 调度服签发的目标场景。
  map<int32,int64> skill_end_ms = 3; // 各技能冷却结束的 Unix 毫秒。
  map<int32,int64> group_end_ms = 4; // 各公共冷却结束的 Unix 毫秒。
  bool changing_line = 5; // 同一角色在线切线时恢复即时资源和冷却。
}

// 网关与调度服间的一次场景选择，玩家身份来自网关绑定的角色。
message SceneRouteRequest {
  int32 role_id = 1; // 已选角色。
  int32 map_id = 2; // 由 GS 上报的公共地图。
  int32 line_id = 3; // 目标线路，零表示自动选择。
  int32 game_id = 4; // 原 GS；首次分配时可为空。
  bool require_game = 5; // 组队进本集结时只选择指定物理宿主。
  int64 scene_uid = 6; // 离线落库确认只释放旧宿主实际持有的场景。
}

// GS 内网注册及网关确认的节点存活状态。
message SceneNodeRegistration {
  int32 realm_id = 1; // 逻辑区服编号。
  int32 game_id = 2; // 部署时配置的 GS 实例。
  string host = 3; // 网关主动连接的内网地址。
  int32 port = 4; // GS 的 TCP 监听端口。
}

// GS 向本区控制服上报进程的真实负载，仅用于 chooseGsType=2 的新场景分配。
message SceneHostLoad {
  int32 game_id = 1; // 发送报告的物理 GS 编号。
  int32 cpu_rate = 2; // 单核占用 100% 记为 10000，多核并行时可超过此值。
  int32 dungeon_count = 3; // 本机当前存活的副本实例数。
}
