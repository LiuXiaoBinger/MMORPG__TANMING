# ============================================================
# Codex 多 Agent 项目级配置 —— 全局约束（config.toml）
# 适用场景：Unity 客户端 + C# 服务端 的多人游戏项目
# 作用：定义 Codex 主 agent 与全部子 agent 在本项目内的
#       执行策略、思考粒度、工具边界与项目硬性规范
# 说明：本文件为项目级配置，仅对当前项目生效。
#       本文件已按 LYFMMORGP 项目实际目录和技术栈修订。
# ============================================================

[project]
name = "LYFMMORGP"
description = "Unity MMORPG 客户端 + .NET Framework 多服务器后端"
language = ["csharp", "protobuf", "toml", "markdown"]
engine = "unity-2023.2.20f1c1"
server_framework = ".NET Framework 4.8"
target_platform = ["PC"]
client_root = "LYF_MMO"
server_root = "LYF_Server"

[codex]
# ---------- 执行策略：决定主 agent 如何拆任务、调度子 agent ----------
main_agent = "Codex"                    # 主控身份固定，开发任务交给对应开发子Agent
main_responsibilities = ["解读需求", "设计开发逻辑", "拆分并发布任务", "最后测试验收", "失败退回原开发子Agent并复测", "协作记录与统一集成"]
strategy = "plan-first"                  # plan-first：先规划再执行（推荐）
think_granularity = "detailed"           # 思考粒度：detailed / balanced / fast
max_planning_rounds = 3                  # 每项任务最多规划轮数
parallel_subagents = true                # 客户端、后端和测试可在边界清晰时并行
allow_self_review = false                # 默认由开发者自检、Codex验收；失败回退后也必须运行必要检查，不以自报替代验证
require_subagent_for_business_code = true # 默认先委派；确认豆包与WorkBuddy无法解决时按agent_quota_workflow由Codex接手

[agent_policy]
# ---------- 子 agent 运行约束 ----------
lightweight_dispatch_rule = "范围明确的代码查找、注释、少量文件小改动及中文记忆同步统一使用本地qwen3:8b-light，调用显式传完整模型名，不静默改用qwen3:8b或qwen3:8b-cpu；最多一次实际执行，连接不可用/输出不完整/自检或验收失败即转豆包查找或WorkBuddy修改，不多次返工、不套各7轮门槛，Qwen不计入两模型轮数。复杂任务直接按既有分工；本条优先于下方历史默认豆包查找规则"
bilingual_memory_rule = "Agent默认只读Docs/AI五类.en.md英文版，先PROJECT_CONTEXT.en.md路由再按主题/编号读取单段；原名.md为开发人员中文版本，缺证据或核验翻译时才定向读取。Codex先更新英文验收事实，委派Qwen或其他外部子Agent据本次差异同步中文，验收同ID/路径/会话轮数/结果与未验边界；不同步不得报收尾完成。英文正文为全中文规则的授权例外，保留中文历史，不承诺固定token节省"
historical_memory_rule = "英文先保留当前有效规则和必要续作事实，原名中文保留完整历史；缺少旧编号英文段时由其他子Agent按该唯一编号读取中文原段、补录同编号英文后供Codex读取。不要求首次分版全文重译，不假称所有历史已翻译，不全量加载中文文件"
search_and_bug_lookup_rule = "代码及参考项目查找、Bug定位默认先派豆包本项目官方桌面只读工作任务，交付精简路径行号、调用链、证据、未确认项与复现信息；Codex不并行重复完整查找，只沿路线核验，路线错误或证据不足先退原任务补充，不直接转GPT独立解题；独立接手必须满足agent_quota_workflow的两模型各7轮门槛。用户明确要求优先，日常协作记录维护不递归派工"
agent_quota_workflow = "默认豆包查找、Codex定向核验、WorkBuddy开发自检、Codex验收集成。同一未解决问题豆包7轮、WorkBuddy7轮，各为首次1轮加返工6轮；未满不得仅因解决不了、路线错误或一次失败切GPT。首个模型7轮仍失败再让另一个补充定位或修复，两个模型各完成7轮仍未通过才由Codex独立查找、设计、实现及验证；提前解决即停止。记录模型、任务/会话/轮次ID、当前轮数、结果和失败证据，新会话不清零；自检、核验、等待、状态查询和连接失败不计轮次。工具不可用恢复原任务并记录阻断，不凑次数或提前切GPT；接手修改前确认原执行者停止。此回退是默认禁止主Agent改业务代码的例外；用户明确提前接手优先"
doubao_problem_rounds_limit = 7 # 同一未解决问题实际执行轮数，含首次1轮和返工6轮
workbuddy_problem_rounds_limit = 7 # 同一未解决问题实际执行轮数，含首次1轮和返工6轮
compact_handoff_rule = "任务单只写问题目标、允许范围、已知证据、验收条件并附任务标识/项目目录/分支/基线；报告仅结论、实际路径行号、必要调用链、检查命令及结果、未确认项和报告路径，详细源码及完整日志留文件。已确认结论引用路径和必要摘要，不重复背景或全量扫描；开发者先自检，Codex核对实际差异、关键证据并完成一次必要验收；通过且相关输入未变不重复读取、编译、测试或审计，只有新修改、失败或未解决问题才定向补验。保留必要编译及关键行为、协议、集成验证，不以自报完成代替验收。协作入口按类别、主题及唯一编号定向读取：先遵守AGENTS，读取PROJECT_CONTEXT的[DOCS-READ]和[DOCS-ROUTES]，检索主题标题后只读命中二级标题至下一二级标题前；代码/文件任务读CURRENT_TASK、DECISIONS、TEST_REPORT相关段落，纯查询/询问/方案只读并更新QUERY_TASKS；若有正式文档产物，执行入口仅留文件变化/文档检查与查询编号。不默认整文件或归档全文加载，历史结论引用路径和短摘要。独立功能只携带必要上下文及短交接；符合自动新开对话规则时按用户长期授权直接创建。完整过程集中一份项目修改日志，CURRENT_TASK、TEST_REPORT和其他必要记录只写各自职责的短摘要与引用；Git回执集中该日志，不为回执重复更新全部入口。逐项文件清单、必要决策和真实失败证据仍保留。小修复采用最小必要验证范围，不扩大为大型验证工程；任务单、工具输出和最终回复简短，完整源码及日志留文件。"
auto_new_chat_rule = "用户长期授权自动新开对话：新需求与之前功能无关联或关联较小，且当前上下文较长时，新建独立对话承接新需求；即使仍是同一功能，上下文过长、出现反复压缩或明显影响任务处理时，也新建对话继续。由Agent判断触发，无需重复询问，用户明确要求留在原对话时优先遵从。创建前先更新CURRENT_TASK和TEST_REPORT的相关短交接；新对话仅携带当前目标、范围、项目目录、当前分支及基线、已核验结论与文件路径、未提交修改范围、待办及外部任务标识和真实轮次，不复制完整旧聊天。保持各7轮计数与原执行任务身份，确认原任务真实状态后续接，避免重复派工或同时写同一文件。使用create_thread创建同项目的本地新对话，先list_projects核对项目；需要精简上下文时采用新建对话，不使用继承全历史的fork_thread。创建成功后给出并打开新对话入口，后续任务由新对话承接，原对话完成交接；创建失败如实记录并保留交接，不能声称已创建或已转移。"
require_scope_check = true               # 执行前先确认是否在自己职责范围内
require_design_before_code = true        # 写代码前必须先输出简要设计
max_edit_batch = 20                      # 单轮最多修改文件数
no_silent_failure = true                 # 失败必须显式报告，不得静默跳过
report_on_complete = true                # 任务完成必须输出变更摘要

[project_rules]
# ---------- 项目硬性规范：所有角色（含主 agent）必须遵守 ----------
user_scope_rule = "用户让做什么就做什么；主Agent和全部子Agent严格按本次要求实现，不自行扩功能、顺带重构、设计额外框架或未来需求，仅做完成当前要求必需的最小适配"
simple_business_rule = "优先实现当前真实需求的最短正常流程；无用户要求或已复现故障，不添加额外校验、身份或状态门禁、代次、队列、重试、确认等待、多层空值判断或异常包装。仅处理接口实际完成结果及必要接入；审查不得因假设场景强加机制"
ui_integration_rule = "新增或融合参考UI沿本项目View、WindowBase、WindowType和现有Ctrl管理窗口，窗口与Widget展示交互，控制器处理业务协议；不另建UI管理器或照搬参考Lua框架。仅界面任务只接打开关闭分页滚动，不擅自实现业务效果；复用字体层级视觉资源，正式控件和引用保存于预制体"
code_style = "C# 现有项目风格：显式类型优先、命名清晰；新增或修改业务代码的类型、接口、函数、字段、属性、常量、事件、参数和局部变量必须使用具体中文注释，说明用途、数据语义、单位/范围或生命周期"
comment_completeness_rule = "新增或修改业务代码必须覆盖类型/接口、函数（含构造函数）、字段、属性、常量、事件、参数及局部变量的具体中文注释；禁止仅重复标识符名称"
boolean_condition_rule = "单个布尔表达式通过&&、||连续组合的判断项最多三个，混合或括号也合并统计；超过时拆为清晰分支或具名条件，保持求值顺序、短路和业务语义，不以换行规避、不新增多余判断；后续新增或修改代码遵守，未经用户另行要求不批量修改既有代码"
folder_layout = "Unity 客户端位于 LYF_MMO/；.NET 服务端位于 LYF_Server/；临时产物统一位于 _temp/"
documentation_archives = "项目修改说明统一存放于 项目修改日志/；项目解析、参考分析、架构设计和功能方案统一存放于 项目分析/；Docs/AI 仅保留五类按标签读取的协作入口记录"
project_difficulty_rule = "遇到特别难实现、难复现、跨模块联动或多次排查与方案取舍的实际问题，必须同步新增或更新 项目分析/项目难点.md 独立条目；记录背景、难点、证据与失败尝试、根因、方案取舍、关键文件、验证边界、未解决事项及面试讲述/追问。未解决先记现状、后续补结论；参与角色提供事实、主Agent汇总，不虚构贡献、收益或上线验证，专题引用使用项目根相对路径"
protocol_rule = "协议源文件统一位于 LYF_Server/ProtoBuf/proto/，生成代码进入 Network；禁止绕过协议源文件私自新增消息号"
determinism_rule = "战斗和帧逻辑使用服务端 LogicTick/固定时间步；禁止用客户端时间或不受控随机作为权威结果"
performance_rule = "Update、网络回调和高频逻辑避免无必要分配、LINQ、装箱和字符串拼接；需结合现有实现逐步优化"
version_control = "功能开发使用codex/feature-development，后续分支沿codex/前缀；仅用户明确要求才合入main。每次代码完成对应检查后提交任务相关文件和修改日志并推送功能分支；中文提交正文记录修改、验证和日志路径，回复报告提交号和推送结果，不混入无关用户改动、不强推"
change_manifest_rule = "每次代码交付在回复和项目修改日志中逐项列新增、修改、移动、删除的文件及用途和具体变化；Unity meta可与对应文件合并列出，不用功能概括替代文件清单"
one_type_per_file = true                 # 每个类、接口、枚举和委托必须独立使用一个源文件
main_agent_boundary = "主Agent使用Codex，负责需求、设计、发布任务和最后验收；默认豆包查找、WorkBuddy开发及自检，Codex不代改业务代码；确认两者无法解决时按agent_quota_workflow独立接手业务实现及验证"
failed_test_rule = "开发子Agent先自检，Codex核对真实文件并必要测试；有明确修正方向将失败证据、复现步骤和预期结果退原任务返工复测，确认两者无法解决时按agent_quota_workflow由Codex接手；未通过或受阻不得报告验收完成"

forbidden = [
  "硬编码 IP / 端口 / 密钥到代码",
  "服务端逻辑放到客户端做权威校验",
  "未经审核直接合入主分支",
  "在 LYF_Server/ProtoBuf/proto 之外自行定义网络协议",
  "将构建、生成或验证中间文件写入 _temp 之外",
  "将测试按钮、Mock 或调试入口写入正式业务脚本或正式预制体",
  "覆盖、回退或删除用户已有修改",
  "在同一个源文件中定义多个顶级类、接口、枚举或委托",
  "在项目代码中使用 foreach；集合遍历统一使用 for",
  "新增或修改业务代码缺少类型、接口、函数、字段、属性、常量、事件、参数或局部变量的具体中文注释",
  "未满足豆包与WorkBuddy无法解决的回退条件时，主agent直接代改客户端或服务端业务代码",
]

[review]
# ---------- 审查阶段要求（代码审查员执行） ----------
rounds_limit = 7                         # 同一问题按模型分别计数，含首次1轮和返工6轮；提前通过即停止
quality_gates = [
  "协议一致性",      # 消息定义是否与 LYF_Server/ProtoBuf/proto 对齐
  "帧同步确定性",    # 是否引入破坏确定性的写法
  "GC 与性能",       # 热路径是否产生 GC 压力
  "安全",            # 登录鉴权、输入校验、防作弊（服务端权威）
  "代码规范",        # 是否遵守 code_style、注释完整性与目录规范
  "项目记录",        # 更新 Docs/AI 协作记录，并将变更日志/专题分析分别归档到项目修改日志/项目分析
]
auto_fix_after_review = false            # 审查后必须由开发角色修复，审查员不代改

[external_agents.doubao]
# 项目流程声明，通过官方桌面CLI派发工作任务；不代表Codex原生子Agent注册。
role = "外部开发子 Agent"
role_file = "AIconfig/agent/doubao_executor.md"
project_name = "LYFMMORGP"
project_id = "38435310952198914"
transport = "desktop-cli"
command = "E:/doubao-cli/doubao-windows.cmd"
local_project_root = "D:/unitypro/LYFMMORGP"
required_mode = "工作模式"
required_environment = "本地电脑"
runtime = "local"
permission = "AskOnRisk"
permission_approval_rule = "用户长期授权：本项目已授权任务的编译、测试、只读查找及允许范围内文件操作权限自动同意，优先allow_once，不再要求用户手动审批；通过真实原生请求处理并记录结果，不扩大任务范围"
verify_before_each_dispatch = true       # 从桌面CLI项目与任务上下文确认本项目的本地工作任务
dispatch_rule = "新任务与返工均指定本项目ID和目录，返工沿用conversationId；禁止网页、headless、普通对话、project none或其他项目；桌面工作任务使用原生agent_mode，不传headless专用mode work"
integration_rule = "核对授权本地文件实际差异并审查测试；仅交付补丁时由本地开发子Agent核基线落盘；失败沿原任务返工，主Agent统一提交推送功能分支"

[external_agents.workbuddy]
# 通过现有Agent Hub和官方桌面网关执行本项目工作任务。
role = "外部开发子 Agent"
role_file = "AIconfig/agent/workbuddy_executor.md"
project_name = "LYFMMORGP"
local_project_root = "D:/unitypro/LYFMMORGP"
transport = "agent-hub-desktop"
provider = "workbuddy"
required_mode = "工作模式"
required_environment = "本地电脑"
skill = "workbuddy-executor"
permission_approval_rule = "用户长期授权优先于Skill通用手动审批约定：本项目已授权任务的编译、测试、只读查找及允许范围内文件操作权限自动选择Allow或allow_once；界面未显示时核对原生待办并处理，不重复询问、派工或伪造回执"
dispatch_rule = "显式传本项目workspace，创建或复用该目录的原生工作会话；返工沿原hub任务或直连taskId，不复用其他目录会话或普通对话"
integration_rule = "WorkBuddy按Codex任务单开发及修改授权本地文件，自检交付；Codex最后测试，不通过返回原任务重新开发或修复并复测，通过后统一集成及提交推送功能分支，保留无关改动，不合main"

[external_agents.qwen]
# 本地外部模型的项目分工声明；不代表注册了Codex原生子Agent或自主文件工具。
role = "本地轻量子Agent"
role_file = "AIconfig/agent/qwen_executor.md"
project_name = "LYFMMORGP"
local_project_root = "D:/unitypro/LYFMMORGP"
transport = "ollama-local-api"
endpoint = "http://127.0.0.1:11434"
model = "qwen3:8b-light"
attempts_limit = 1 # 同一轻量任务只实际尝试一次，不反复返工。
fallback_lookup = "doubao"
fallback_edit = "workbuddy"
context_window = 4096 # 短任务起点；更大窗口须以本机实测为准。
thinking = false # 轻量任务默认关闭思考输出，保持限定输入与简短交付。
dispatch_rule = "Codex限定文件/输入和验收，调用本地API取得结果，实际搜索或落盘由有对应工具的调用方执行并核验，不运行模型自由生成的命令；失败按lightweight_dispatch_rule交其他模型"
integration_rule = "交付真实文件清单和检查证据，Codex最终核验；英文记忆对应中文本次段落由子Agent更新，不能以模型文本回复冒充文件写入或编译通过"
